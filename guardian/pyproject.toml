[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-guardian"
version = "0.1.0"
description = "Predictive mobility assistance for visually impaired pedestrians"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "opencv-python>=4.9",
]

[project.optional-dependencies]
# Perception stack. Heavy; not needed to run the risk-kernel tests.
perception = [
  "torch>=2.3",
  "torchvision>=0.18",
  "ultralytics>=8.3",
  "transformers>=4.45",
  "accelerate>=0.34",
]
audio = ["faster-whisper>=1.0", "sounddevice>=0.4", "piper-tts>=1.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
guardian-live = "scripts.run_live:main"
guardian-eval = "scripts.eval:main"
guardian-bench = "guardian.deploy.benchmark:main"
guardian-export = "guardian.deploy.export:main"

[tool.setuptools.packages.find]
include = ["guardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
